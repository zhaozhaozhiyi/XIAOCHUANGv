name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whitespace
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE_SHA" ] && ! echo "$BASE_SHA" | grep -Eq '^0+$'; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff-tree --check --root -r HEAD
          fi

      - name: Build shared packages
        run: |
          npm run build --workspace packages/contracts
          npm run build --workspace packages/canvas-shared
          npm run build --workspace packages/ui

      - name: Test shared canvas package
        run: npm test --workspace packages/canvas-shared

      - name: Typecheck backend
        run: npm run typecheck --workspace apps/backend

      - name: Test backend
        run: npm test --workspace apps/backend

      - name: Build backend
        run: npm run build --workspace apps/backend

      - name: Lint web
        run: npm run lint --workspace apps/web

      - name: Build web
        run: npm run build --workspace apps/web
