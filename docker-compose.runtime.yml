x-backend-runtime-env: &backend-runtime-env
  NODE_ENV: production
  DATABASE_URL: postgresql://zhaoxiaogang:xiaochuang@postgres:5432/xiaochuang?schema=public
  REDIS_URL: redis://redis:6379
  TASK_QUEUE_NAME: ${TASK_QUEUE_NAME:-backend-tasks}
  STORAGE_DRIVER: s3
  STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://127.0.0.1:${MINIO_API_PORT:-9000}/xiaochuang-media}
  STORAGE_S3_FORCE_PATH_STYLE: "true"
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-xiaochuang-media}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin123}

services:
  postgres:
    image: postgres:16-alpine
    container_name: xiaochuang-postgres
    environment:
      POSTGRES_USER: zhaoxiaogang
      POSTGRES_PASSWORD: xiaochuang
      POSTGRES_DB: xiaochuang
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.local/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhaoxiaogang -d xiaochuang"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: xiaochuang-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.local/redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: xiaochuang-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./.local/minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/xiaochuang-media &&
        mc anonymous set download local/xiaochuang-media

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: xiaochuang-backend:${BACKEND_IMAGE_TAG:-local}
    container_name: xiaochuang-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *backend-runtime-env
      HOST: 0.0.0.0
      PORT: 3010
    ports:
      - "${BACKEND_PORT:-3010}:3010"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3010/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: xiaochuang-backend:${BACKEND_IMAGE_TAG:-local}
    container_name: xiaochuang-worker
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-runtime-env
    command:
      - npm
      - run
      - start:worker
      - --workspace
      - apps/backend
      - --
      - --ready-file=/tmp/task-worker-ready.json
      - --concurrency=${TASK_WORKER_CONCURRENCY:-2}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const fs=require('node:fs');try{const s=JSON.parse(fs.readFileSync('/tmp/task-worker-ready.json','utf8'));process.exit(s.status==='ready'?0:1)}catch{process.exit(1)}"
      interval: 5s
      timeout: 3s
      retries: 30
